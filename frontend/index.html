<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boutique — Shop smarter, live better</title>
  <meta name="description" content="Boutique — une boutique en ligne moderne : vêtements, électronique, maison, chaussures et accessoires.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="logo">Boutique</a>

      <button class="hamburger-btn" id="hamburgerBtn" aria-label="Ouvrir le menu" aria-expanded="false" aria-controls="mainNav">
        <span></span><span></span><span></span>
      </button>

      <nav class="main-nav" id="mainNav">
        <a href="shop.html">Boutique</a>
        <a href="shop.html#categories">Categories</a>
        <a href="shop.html?sort=newest">New Arrivals</a>
        <a href="shop.html?promo=true">Deals</a>
      </nav>

      <div class="header-actions">
        <button class="icon-btn" id="searchToggle" aria-label="Rechercher">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
        <a href="cart.html" class="icon-btn cart-btn" aria-label="Voir le panier">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
          <span class="cart-count" id="cartCount">0</span>
        </a>
        <div class="user-menu">
          <button class="icon-btn" id="userMenuToggle" aria-label="Compte utilisateur" aria-haspopup="true" aria-expanded="false">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </button>
          <div class="user-menu-dropdown" id="userMenuDropdown">
            <!-- Rempli dynamiquement par auth.js : infos du compte OU boutons Login/Create -->
          </div>
        </div>
      </div>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="hero-content">
        <h1>Shop smarter, <span>live better</span></h1>
        <p>Des vêtements, accessoires et objets du quotidien choisis avec soin, à prix juste.</p>
        <a href="shop.html" class="btn btn-primary btn-lg">Découvrir la boutique</a>
      </div>
    </section>

    <section class="featured-categories">
      <h2>Catégories populaires</h2>
      <div class="category-grid" id="homeCategoryGrid">
        <!-- Rempli dynamiquement par main.js à partir de GET /api/categories -->
      </div>
    </section>

    <section class="featured-products">
      <h2>Nouveautés</h2>
      <div class="product-grid" id="homeProductGrid">
        <!-- Rempli dynamiquement par products.js (GET /api/products?sort=newest&limit=4) -->
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-links">
        <a href="about.html">About Us</a>
        <a href="contact.html">Contact</a>
        <a href="shipping-policy.html">Shipping</a>
        <a href="return-policy.html">Returns</a>
        <a href="privacy-policy.html">Privacy Policy</a>
      </div>
      <div class="footer-social" aria-label="Réseaux sociaux">
        <a href="#" aria-label="Facebook">●</a>
        <a href="#" aria-label="Instagram">●</a>
        <a href="#" aria-label="Twitter">●</a>
        <a href="#" aria-label="YouTube">●</a>
      </div>
    </div>
  </footer>

  <script src="js/api.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/cart.js" defer></script>
  <script src="js/products.js" defer></script>
  <script src="js/main.js" defer></script>
</body>
</html>
