<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boutique — Tous les produits</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="logo">Boutique</a>
      <button class="hamburger-btn" id="hamburgerBtn" aria-label="Ouvrir le menu" aria-expanded="false" aria-controls="mainNav">
        <span></span><span></span><span></span>
      </button>
      <nav class="main-nav" id="mainNav">
        <a href="shop.html" class="active">Boutique</a>
        <a href="shop.html#categories">Categories</a>
        <a href="shop.html?sort=newest">New Arrivals</a>
        <a href="shop.html?promo=true">Deals</a>
      </nav>
      <div class="header-actions">
        <button class="icon-btn" id="searchToggle" aria-label="Rechercher">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
        <a href="cart.html" class="icon-btn cart-btn" aria-label="Voir le panier">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
          <span class="cart-count" id="cartCount">0</span>
        </a>
        <div class="user-menu">
          <button class="icon-btn" id="userMenuToggle" aria-label="Compte utilisateur" aria-haspopup="true" aria-expanded="false">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </button>
          <div class="user-menu-dropdown" id="userMenuDropdown"></div>
        </div>
      </div>
    </div>
  </header>

  <main class="shop-page">
    <div class="shop-header">
      <h1>Boutique</h1>
      <form class="search-bar" id="searchForm" role="search">
        <label for="searchInput" class="sr-only">Rechercher un produit</label>
        <input type="search" id="searchInput" name="search" placeholder="Rechercher un produit...">
        <button type="submit" aria-label="Lancer la recherche">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
      </form>
    </div>

    <p id="searchStatus" class="search-status" aria-live="polite"></p>

    <div class="shop-layout">
      <button class="filters-toggle" id="filtersToggle" aria-expanded="false" aria-controls="shopSidebar">Filtres</button>

      <aside class="shop-sidebar" id="shopSidebar">
        <div class="filter-group" id="categories">
          <h2>Categories</h2>
          <fieldset id="categoryFilters">
            <legend class="sr-only">Filtrer par catégorie</legend>
            <!-- Cases à cocher générées dynamiquement par products.js depuis GET /api/categories -->
          </fieldset>
        </div>

        <div class="filter-group">
          <h2>Prix</h2>
          <div class="price-range">
            <label for="minPrice" class="sr-only">Prix minimum</label>
            <input type="number" id="minPrice" min="0" placeholder="minimum">
            <span>—</span>
            <label for="maxPrice" class="sr-only">Prix maximum</label>
            <input type="number" id="maxPrice" min="0" placeholder="maximum">
          </div>
        </div>

        <div class="filter-group">
          <h2>Disponibilité</h2>
          <label class="checkbox-line">
            <input type="checkbox" id="inStockOnly">
            En stock uniquement
          </label>
        </div>

        <div class="filter-group">
          <h2>Trier par</h2>
          <label for="sortSelect" class="sr-only">Trier les produits</label>
          <select id="sortSelect">
            <option value="newest">Plus récent</option>
            <option value="price_asc">Prix croissant</option>
            <option value="price_desc">Prix décroissant</option>
            <option value="popularity">Popularité</option>
          </select>
        </div>

        <button class="btn btn-outline" id="resetFilters">Réinitialiser</button>
      </aside>

      <section class="shop-products" aria-live="polite">
        <div class="product-grid" id="productGrid">
          <!-- Cartes produit générées dynamiquement par products.js -->
        </div>

        <p class="empty-state" id="emptyState" hidden>Aucun produit trouvé.</p>

        <nav class="pagination" id="pagination" aria-label="Pagination des produits"></nav>
      </section>
    </div>
  </main>

  <template id="productCardTemplate">
    <article class="product-card">
      <a class="product-card-image" href="#">
        <img src="" alt="">
        <button class="favorite-btn" aria-label="Ajouter aux favoris" type="button">♡</button>
      </a>
      <div class="product-card-body">
        <a class="product-card-category" href="#"></a>
        <a class="product-card-name" href="#"></a>
        <div class="product-card-price">
          <span class="price"></span>
          <span class="old-price"></span>
        </div>
        <button class="btn btn-primary add-to-cart-btn" type="button">Ajouter au panier</button>
      </div>
    </article>
  </template>

  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-links">
        <a href="about.html">About Us</a>
        <a href="contact.html">Contact</a>
        <a href="shipping-policy.html">Shipping</a>
        <a href="return-policy.html">Returns</a>
        <a href="privacy-policy.html">Privacy Policy</a>
      </div>
      <div class="footer-social" aria-label="Réseaux sociaux">
        <a href="#" aria-label="Facebook">●</a>
        <a href="#" aria-label="Instagram">●</a>
        <a href="#" aria-label="Twitter">●</a>
        <a href="#" aria-label="YouTube">●</a>
      </div>
    </div>
  </footer>

  <script src="js/api.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/cart.js" defer></script>
  <script src="js/products.js" defer></script>
  <script src="js/main.js" defer></script>
</body>
</html>
