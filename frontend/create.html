<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boutique — Login / Create Account</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="logo">Boutique</a>
      <button class="hamburger-btn" id="hamburgerBtn" aria-label="Ouvrir le menu" aria-expanded="false" aria-controls="mainNav">
        <span></span><span></span><span></span>
      </button>
      <nav class="main-nav" id="mainNav">
        <a href="shop.html">Boutique</a>
        <a href="shop.html#categories">Categories</a>
        <a href="shop.html?sort=newest">New Arrivals</a>
        <a href="shop.html?promo=true">Deals</a>
      </nav>
      <div class="header-actions">
        <a href="cart.html" class="icon-btn cart-btn" aria-label="Voir le panier">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
          <span class="cart-count" id="cartCount">0</span>
        </a>
      </div>
    </div>
  </header>

  <main class="auth-page">
    <div class="auth-columns">

      <section class="auth-card" aria-labelledby="registerTitle">
        <h1 id="registerTitle">Create Account</h1>
        <form id="registerForm" novalidate>
          <div class="form-row">
            <div class="form-field">
              <label for="firstName">First Name</label>
              <input type="text" id="firstName" name="firstName" required autocomplete="given-name">
            </div>
            <div class="form-field">
              <label for="lastName">Last Name</label>
              <input type="text" id="lastName" name="lastName" required autocomplete="family-name">
            </div>
          </div>
          <div class="form-field">
            <label for="registerEmail">Email</label>
            <input type="email" id="registerEmail" name="email" placeholder="email@exemple.com" required autocomplete="email">
            <span class="field-error" id="registerEmailError"></span>
          </div>
          <div class="form-field password-field">
            <label for="registerPassword">Password</label>
            <input type="password" id="registerPassword" name="password" required minlength="8" autocomplete="new-password">
            <button type="button" class="toggle-password" data-target="registerPassword" aria-label="Afficher le mot de passe">👁</button>
            <span class="field-error" id="registerPasswordError">8 caractères minimum</span>
          </div>

          <p class="form-message" id="registerMessage" role="alert"></p>

          <button type="submit" class="btn btn-primary btn-block">Register</button>
        </form>
      </section>


    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-links">
        <a href="#">About Us</a>
        <a href="#">Contact</a>
        <a href="#">FAQ</a>
      </div>
      <div class="footer-social" aria-label="Réseaux sociaux">
        <a href="#" aria-label="Facebook">●</a>
        <a href="#" aria-label="Instagram">●</a>
        <a href="#" aria-label="Twitter">●</a>
        <a href="#" aria-label="YouTube">●</a>
      </div>
    </div>
  </footer>

  <script src="js/api.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/cart.js" defer></script>
  <script src="js/main.js" defer></script>
</body>
</html>
